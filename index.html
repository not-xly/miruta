<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MiRuta">
  <meta name="format-detection" content="telephone=no">
  <title>MiRuta</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Pantalla 1: listado de viajes -->
  <section id="listView" class="view">
    <header class="topbar">
      <h1>MiRuta</h1>
      <button type="button" class="add" id="addTrip" aria-label="Nuevo viaje">+</button>
    </header>
    <main id="tripList" class="trip-list"></main>
  </section>

  <!-- Pantalla 2: detalle de un viaje, un apartado a la vez -->
  <section id="tripView" class="view" hidden>
    <header class="head">
      <div class="topbar">
        <a href="#/" class="back">‹ Viajes</a>
        <h1 id="tripTitle"></h1>
      </div>
      <nav class="tabs" id="tabs">
        <button type="button" data-tab="fechas">Fechas</button>
        <button type="button" data-tab="desp">Desplazamientos</button>
        <button type="button" data-tab="aloj">Alojamientos</button>
        <button type="button" data-tab="pend">Pendientes</button>
        <button type="button" data-tab="vida">Gastos</button>
        <button type="button" data-tab="ideas">Ideas</button>
        <button type="button" data-tab="notas">Notas</button>
        <button type="button" data-tab="resumen">Resumen</button>
      </nav>
    </header>

    <main class="content">

      <section class="panel" data-panel="fechas">
        <h2>Fechas</h2>
        <div class="stack">
          <input id="fName" type="text" placeholder="Nombre del viaje" maxlength="60" aria-label="Nombre del viaje">
          <div class="row2">
            <label>Inicio<input id="fStart" type="date"></label>
            <label>Regreso<input id="fEnd" type="date"></label>
          </div>
          <p class="muted" id="fHint"></p>
        </div>
        <button type="button" class="btn-danger" id="deleteTrip">Eliminar viaje</button>
      </section>

      <section class="panel" data-panel="desp" hidden>
        <div class="panel-head">
          <h2>Desplazamientos</h2>
          <span class="sum" id="sumDesp"></span>
          <button type="button" class="btn-new" data-new="transports">+ Añadir</button>
        </div>
        <div class="list" id="listDesp"></div>
      </section>

      <section class="panel" data-panel="aloj" hidden>
        <div class="panel-head">
          <h2>Alojamientos</h2>
          <span class="sum" id="sumAloj"></span>
          <button type="button" class="btn-new" data-new="stays">+ Añadir</button>
        </div>
        <div class="list" id="listAloj"></div>
      </section>

      <section class="panel" data-panel="pend" hidden>
        <div class="panel-head">
          <h2>Pendientes</h2>
          <button type="button" class="btn-new" data-new="todos">+ Añadir</button>
        </div>
        <div class="list" id="listPend"></div>
      </section>

      <section class="panel" data-panel="vida" hidden>
        <div class="panel-head">
          <h2>Gastos de vida</h2>
          <span class="sum" id="sumVida"></span>
          <button type="button" class="btn-new" data-new="expenses">+ Añadir</button>
        </div>
        <div class="list" id="listVida"></div>
        <div class="totals"><span>Gasto medio por día</span><span id="mediaVida"></span></div>
      </section>

      <section class="panel" data-panel="ideas" hidden>
        <div class="panel-head">
          <h2>Ideas</h2>
          <button type="button" class="btn-new" data-new="ideas">+ Añadir</button>
        </div>
        <div class="seg" id="ideaFilters">
          <button type="button" data-filter="todas" class="on">Todas</button>
          <button type="button" data-filter="turismo">Turismo</button>
          <button type="button" data-filter="restauracion">Restauración</button>
        </div>
        <div class="list" id="listIdeas"></div>
      </section>

      <section class="panel" data-panel="notas" hidden>
        <h2>Notas del viaje</h2>
        <textarea id="tripNotes" placeholder="Lo que vais viendo, comiendo y disfrutando…"></textarea>
      </section>

      <section class="panel" data-panel="resumen" hidden>
        <h2>Resumen de gastos</h2>
        <div class="list">
          <div class="res"><span>Desplazamientos</span><span id="resDesp"></span></div>
          <div class="res"><span>Alojamientos</span><span id="resAloj"></span></div>
          <div class="res"><span>Gastos de vida</span><span id="resVida"></span></div>
          <div class="res total"><span>Total del viaje</span><span id="resTotal"></span></div>
        </div>
      </section>
    </main>
  </section>

  <!-- Ventana de introducción de datos: alta y edición -->
  <dialog id="sheetDialog" class="sheet">
    <form id="sheetForm">
      <h2 id="sheetTitle"></h2>
      <div id="sheetBody" class="sheet-body"></div>
      <div class="sheet-foot">
        <button type="button" class="btn-del" id="sheetDelete" hidden>Eliminar</button>
        <span class="grow"></span>
        <button type="button" class="btn-secondary" id="sheetCancel">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Diálogo: nuevo viaje -->
  <dialog id="newTripDialog">
    <form id="newTripForm">
      <h2>Nuevo viaje</h2>
      <input id="newTripName" type="text" placeholder="Nombre (ej. Europa noviembre)" maxlength="60" required aria-label="Nombre del viaje">
      <div class="row2">
        <label>Inicio<input id="newTripStart" type="date"></label>
        <label>Regreso<input id="newTripEnd" type="date"></label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" id="cancelTrip">Cancelar</button>
        <button type="submit" class="btn-primary">Crear</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
