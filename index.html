<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MiRuta">
  <meta name="format-detection" content="telephone=no">
  <title>MiRuta</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Pantalla 1: listado de viajes (crear, editar, eliminar y ordenar) -->
  <section id="listView" class="view">
    <header class="topbar">
      <h1>MiRuta</h1>
      <button type="button" class="add" id="addTrip" aria-label="Nuevo viaje">+</button>
    </header>
    <div class="sort-bar">
      <span class="muted">Ordenar por</span>
      <div class="seg" id="sortBar">
        <button type="button" data-sort="start" class="on">Fecha</button>
        <button type="button" data-sort="name">Nombre</button>
      </div>
    </div>
    <main id="tripList" class="trip-list"></main>
  </section>

  <!-- Pantalla 2: detalle de un viaje, un apartado a la vez -->
  <section id="tripView" class="view" hidden>
    <header class="head">
      <div class="topbar">
        <a href="#/" class="back">‹ Viajes</a>
        <div class="title">
          <h1 id="tripTitle"></h1>
          <p class="sub" id="tripDates"></p>
        </div>
        <button type="button" class="juntos" id="juntosBtn" aria-pressed="false">Juntos</button>
      </div>
      <nav class="tabs" id="tabs">
        <button type="button" class="row1" data-tab="desp">Moverse</button>
        <button type="button" class="row1" data-tab="aloj">Dormir</button>
        <button type="button" class="row1" data-tab="hacer">Hacer</button>
        <button type="button" class="row2" data-tab="vida">Gastos</button>
        <button type="button" class="row2" data-tab="ideas">Ideas</button>
        <button type="button" class="row2" data-tab="notas">Notas</button>
        <button type="button" class="row2" data-tab="resumen">Resumen</button>
      </nav>
    </header>

    <main class="content">

      <section class="panel" data-panel="desp" hidden>
        <div class="panel-head">
          <h2>Moverse</h2>
          <span class="sum" id="sumDesp"></span>
          <button type="button" class="btn-new" data-new="transports">+ Añadir</button>
        </div>
        <div class="list" id="listDesp"></div>
      </section>

      <section class="panel" data-panel="aloj" hidden>
        <div class="panel-head">
          <h2>Dormir</h2>
          <span class="sum" id="sumAloj"></span>
          <button type="button" class="btn-new" data-new="stays">+ Añadir</button>
        </div>
        <div class="list" id="listAloj"></div>
      </section>

      <section class="panel" data-panel="hacer" hidden>
        <div class="panel-head">
          <h2>Hacer</h2>
          <button type="button" class="btn-new" data-new="todos">+ Añadir</button>
        </div>
        <div class="list" id="listHacer"></div>
      </section>

      <section class="panel" data-panel="vida" hidden>
        <div class="panel-head">
          <h2>Gastos de vida</h2>
          <span class="sum" id="sumVida"></span>
          <button type="button" class="btn-new" data-new="expenses">+ Añadir</button>
        </div>
        <div class="list" id="listVida"></div>
        <div class="totals"><span>Gasto medio por día</span><span id="mediaVida"></span></div>
      </section>

      <section class="panel" data-panel="ideas" hidden>
        <div class="panel-head">
          <h2>Ideas</h2>
          <button type="button" class="btn-new" data-new="ideas">+ Añadir</button>
        </div>
        <div class="seg" id="ideaFilters">
          <button type="button" data-filter="todas" class="on">Todas</button>
          <button type="button" data-filter="turismo">Turismo</button>
          <button type="button" data-filter="restauracion">Restauración</button>
          <button type="button" data-filter="transporte">Transporte</button>
        </div>
        <div class="list" id="listIdeas"></div>
      </section>

      <section class="panel" data-panel="notas" hidden>
        <h2>Notas del viaje</h2>
        <textarea id="tripNotes" placeholder="Lo que vais viendo, comiendo y disfrutando…"></textarea>
      </section>

      <section class="panel" data-panel="resumen" hidden>
        <h2>Resumen de gastos</h2>
        <div class="list">
          <div class="res"><span>Moverse</span><span id="resDesp"></span></div>
          <div class="res"><span>Dormir</span><span id="resAloj"></span></div>
          <div class="res"><span>Gastos de vida</span><span id="resVida"></span></div>
          <div class="res total"><span>Total del viaje</span><span id="resTotal"></span></div>
        </div>
      </section>
    </main>
  </section>

  <!-- Ventana de introducción de datos: alta y edición de cada elemento -->
  <dialog id="sheetDialog" class="sheet">
    <form id="sheetForm">
      <h2 id="sheetTitle"></h2>
      <div id="sheetBody" class="sheet-body"></div>
      <div class="sheet-foot">
        <button type="button" class="btn-del" id="sheetDelete" hidden>Eliminar</button>
        <span class="grow"></span>
        <button type="button" class="btn-secondary" id="sheetCancel">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Ventana de viaje: nuevo o editar, con un calendario para las dos fechas -->
  <dialog id="tripDialog">
    <form id="tripForm">
      <h2 id="tripDialogTitle">Nuevo viaje</h2>
      <input id="tripName" type="text" placeholder="Nombre (ej. Europa noviembre)" maxlength="60" required aria-label="Nombre del viaje">
      <div id="tripCal"></div>
      <p class="muted" id="tripRange"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" id="cancelTrip">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
